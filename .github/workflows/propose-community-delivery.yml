name: Propose community delivery integration
on:
  push:
    branches: [codex/discord-event-delivery]
permissions:
  contents: read
  pull-requests: write
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether the dispatcher is configured
        env:
          DISPATCH_TOKEN: ${{ secrets.FEED_DISPATCH_TOKEN }}
        run: |
          if [ -n "$DISPATCH_TOKEN" ]; then
            echo "DISPATCH_CREDENTIAL_CONFIGURED=true"
          else
            echo "DISPATCH_CREDENTIAL_CONFIGURED=false"
          fi
      - name: Create a draft review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh pr view codex/discord-event-delivery --json url --jq .url; then
            exit 0
          fi
          body=$(mktemp)
          cat > "$body" <<'BODY'
          Scheduled polling has missed hours of community updates. Request a refresh immediately when repository events occur, while the existing community automation remains the sole writer and Discord poster.
          
          The notification executes no checkout or event-provided code, retries transient dispatch failures, and fails visibly when its scoped Actions credential is missing. Validation covers shell syntax, missing credentials, success, and retries. FEED_DISPATCH_TOKEN must authorize workflow dispatch on the community automation repository before activation.
          BODY
          gh pr create --draft --base main --head codex/discord-event-delivery --title "Refresh community updates directly from repository events" --body-file "$body"

